modules:
  confluence:contentAction:
    - key: create-from-template-action
      title: Create page from template
      description: Create a child page from a bundled template.
      resource: action-ui
      resolver:
        function: resolver
      render: native
  macro:
    - key: template-pages-index-macro
      title: Template pages index
      description: Lists the child pages created by Template Pages.
      resource: macro-ui
      resolver:
        function: resolver
      render: native
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: action-ui
    path: src/frontend/action.jsx
  - key: macro-ui
    path: src/frontend/macro.jsx
permissions:
  scopes:
    - read:page:confluence
    - write:page:confluence
    - read:label:confluence
    - write:label:confluence
    - search:confluence
app:
  id: ari:cloud:ecosystem::app/<replace-after-forge-register>
  runtime:
    name: nodejs22.x
